<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pencils, paint tubes and a brush surrounded by colorful paint strokes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="pencil">
      <rect x="-14" y="-300" width="28" height="300" fill="currentColor"/>
      <rect x="2" y="-300" width="12" height="300" fill="#000" opacity="0.14"/>
      <polygon points="-14,-300 14,-300 0,-352" fill="#EBCB9F"/>
      <polygon points="-4.6,-335 4.6,-335 0,-352" fill="currentColor"/>
      <rect x="-14" y="-34" width="28" height="34" fill="#B9C0CA"/>
      <rect x="-14" y="-24" width="28" height="4" fill="#8E97A4"/>
    </g>
    <g id="tube">
      <polygon points="-30,0 30,0 24,26 -24,26" fill="#C5CBD4"/>
      <rect x="-30" y="-190" width="60" height="190" rx="6" fill="currentColor"/>
      <rect x="-30" y="-120" width="60" height="46" fill="#fff" opacity="0.9"/>
      <rect x="12" y="-190" width="18" height="190" rx="6" fill="#000" opacity="0.12"/>
      <polygon points="-30,-190 30,-190 16,-214 -16,-214" fill="currentColor"/>
      <rect x="-14" y="-246" width="28" height="34" rx="4" fill="#2B2F3A"/>
    </g>
  </defs>

  <!-- paper -->
  <rect width="1920" height="600" fill="#E9EEF5"/>
  <circle cx="330" cy="150" r="260" fill="#CFE0F5" opacity="0.7"/>
  <circle cx="1620" cy="470" r="300" fill="#F6D9E4" opacity="0.7"/>
  <circle cx="1100" cy="40" r="180" fill="#FBEBC4" opacity="0.6"/>

  <!-- paint strokes -->
  <path d="M60 520 C 320 420, 520 600, 800 500" fill="none" stroke="#2F6FDB" stroke-width="34" stroke-linecap="round" opacity="0.9"/>
  <path d="M120 570 C 380 500, 560 620, 760 570" fill="none" stroke="#F2B632" stroke-width="20" stroke-linecap="round" opacity="0.95"/>
  <path d="M1120 90 C 1300 20, 1480 150, 1700 70 S 1860 60, 1900 90" fill="none" stroke="#E5486E" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
  <path d="M1180 140 C 1340 100, 1500 190, 1680 130" fill="none" stroke="#1FA37A" stroke-width="16" stroke-linecap="round" opacity="0.95"/>

  <!-- splatters -->
  <circle cx="860" cy="120" r="14" fill="#2F6FDB"/>
  <circle cx="900" cy="170" r="7" fill="#2F6FDB"/>
  <circle cx="830" cy="190" r="5" fill="#2F6FDB"/>
  <circle cx="1060" cy="520" r="12" fill="#E5486E"/>
  <circle cx="1020" cy="560" r="6" fill="#E5486E"/>
  <circle cx="1100" cy="565" r="5" fill="#F2B632"/>
  <circle cx="540" cy="90" r="10" fill="#1FA37A"/>
  <circle cx="580" cy="130" r="5" fill="#F2B632"/>

  <!-- pencils fanned on the left -->
  <g transform="translate(250 650)">
    <use href="#pencil" color="#E5486E" transform="rotate(-34)"/>
    <use href="#pencil" color="#F2B632" transform="rotate(-17)"/>
    <use href="#pencil" color="#2F6FDB" transform="rotate(0)"/>
    <use href="#pencil" color="#1FA37A" transform="rotate(17)"/>
    <use href="#pencil" color="#7A4FD6" transform="rotate(34)"/>
  </g>

  <!-- paint tubes on the right -->
  <g transform="translate(1480 590)">
    <use href="#tube" color="#2F6FDB" transform="translate(-130 0) rotate(-16)"/>
    <use href="#tube" color="#E5486E" transform="translate(0 20) rotate(2)"/>
    <use href="#tube" color="#F2B632" transform="translate(130 0) rotate(18)"/>
  </g>

  <!-- brush -->
  <g transform="translate(1790 560) rotate(28)">
    <rect x="-8" y="-420" width="16" height="360" rx="8" fill="#6B4A32"/>
    <rect x="-8" y="-420" width="6" height="360" rx="3" fill="#fff" opacity="0.18"/>
    <rect x="-11" y="-70" width="22" height="48" fill="#B9C0CA"/>
    <rect x="-11" y="-52" width="22" height="4" fill="#8E97A4"/>
    <path d="M-11 -22 C -14 20, -4 50, 0 70 C 4 50, 14 20, 11 -22 Z" fill="#1FA37A"/>
  </g>
  <!-- words -->
  <path d="M470 282 C 640 262, 820 296, 1010 272 S 1180 270, 1240 278" fill="none" stroke="#F2B632" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
  <text x="860" y="244" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1E2A44">Your art starts here.</text>
  <text x="860" y="338" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="28" fill="#4A5670">Pencils, paints, brushes and sketch pads</text>
  <text x="860" y="376" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="28" fill="#4A5670">for every kind of artist.</text>
</svg>
