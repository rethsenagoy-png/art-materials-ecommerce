<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sketch pad with pencils and a watercolor palette. Sketch. Paint. Repeat." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="pencil">
      <rect x="-14" y="-300" width="28" height="300" fill="currentColor"/>
      <rect x="2" y="-300" width="12" height="300" fill="#000" opacity="0.14"/>
      <polygon points="-14,-300 14,-300 0,-352" fill="#EBCB9F"/>
      <polygon points="-4.6,-335 4.6,-335 0,-352" fill="currentColor"/>
      <rect x="-14" y="-34" width="28" height="34" fill="#B9C0CA"/>
      <rect x="-14" y="-24" width="28" height="4" fill="#8E97A4"/>
    </g>
  </defs>

  <!-- paper and watercolor washes -->
  <rect width="1920" height="600" fill="#F1EDF7"/>
  <circle cx="360" cy="420" r="300" fill="#D9CCF0" opacity="0.65"/>
  <circle cx="1560" cy="120" r="260" fill="#FAD9D2" opacity="0.7"/>
  <circle cx="1000" cy="600" r="220" fill="#CFE8E0" opacity="0.7"/>
  <circle cx="900" cy="20" r="170" fill="#FBEBC4" opacity="0.6"/>

  <!-- sketch pad -->
  <g transform="translate(300 330) rotate(-8)">
    <rect x="-146" y="-192" width="300" height="400" rx="10" fill="#000" opacity="0.08"/>
    <rect x="-150" y="-200" width="300" height="400" rx="10" fill="#FFFFFF" stroke="#D5D9E2" stroke-width="2"/>
    <rect x="-150" y="-200" width="300" height="46" rx="10" fill="#7A4FD6"/>
    <rect x="-150" y="-170" width="300" height="16" fill="#7A4FD6"/>
    <g fill="#F1EDF7" stroke="#8E97A4" stroke-width="3">
      <circle cx="-125" cy="-178" r="8"/><circle cx="-95" cy="-178" r="8"/><circle cx="-65" cy="-178" r="8"/>
      <circle cx="-35" cy="-178" r="8"/><circle cx="-5" cy="-178" r="8"/><circle cx="25" cy="-178" r="8"/>
      <circle cx="55" cy="-178" r="8"/><circle cx="85" cy="-178" r="8"/><circle cx="115" cy="-178" r="8"/>
    </g>
    <!-- pencil sketch: sun and hills -->
    <g fill="none" stroke="#5B6472" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="55" cy="-70" r="34"/>
      <path d="M-115 120 C -70 30, -30 100, 10 20 S 80 90, 118 50"/>
      <path d="M-115 150 C -60 100, 0 150, 118 100"/>
    </g>
    <g stroke="#9AA2B0" stroke-width="2" stroke-linecap="round">
      <line x1="30" y1="-92" x2="44" y2="-106"/><line x1="40" y1="-82" x2="62" y2="-104"/>
      <line x1="-100" y1="130" x2="-86" y2="116"/><line x1="-80" y1="140" x2="-62" y2="122"/>
    </g>
  </g>

  <!-- pencils resting on the pad -->
  <g transform="translate(215 600)">
    <use href="#pencil" color="#F2B632" transform="rotate(66)"/>
    <use href="#pencil" color="#5B6472" transform="translate(30 -10) rotate(76)"/>
  </g>

  <!-- watercolor palette -->
  <g transform="translate(1650 350) rotate(10) scale(0.92)">
    <path d="M-200 -20 C -200 -140, -60 -190, 80 -170 C 200 -150, 230 -40, 190 50 C 150 140, 40 170, -60 150 C -150 130, -200 80, -200 -20 Z" fill="#000" opacity="0.08" transform="translate(6 10)"/>
    <path d="M-200 -20 C -200 -140, -60 -190, 80 -170 C 200 -150, 230 -40, 190 50 C 150 140, 40 170, -60 150 C -150 130, -200 80, -200 -20 Z" fill="#F4E3C8" stroke="#D9C19A" stroke-width="3"/>
    <ellipse cx="-125" cy="65" rx="26" ry="19" fill="#F1EDF7" stroke="#D9C19A" stroke-width="3"/>
    <circle cx="-110" cy="-60" r="30" fill="#E5486E"/>
    <circle cx="-30" cy="-105" r="30" fill="#F28A32"/>
    <circle cx="55" cy="-100" r="30" fill="#F2B632"/>
    <circle cx="130" cy="-45" r="30" fill="#1FA37A"/>
    <circle cx="112" cy="40" r="30" fill="#2F6FDB"/>
    <circle cx="30" cy="75" r="30" fill="#7A4FD6"/>
    <g fill="#fff" opacity="0.35">
      <ellipse cx="-120" cy="-70" rx="9" ry="5"/><ellipse cx="-40" cy="-115" rx="9" ry="5"/>
      <ellipse cx="45" cy="-110" rx="9" ry="5"/><ellipse cx="120" cy="-55" rx="9" ry="5"/>
      <ellipse cx="102" cy="30" rx="9" ry="5"/><ellipse cx="20" cy="65" rx="9" ry="5"/>
    </g>
  </g>

  <!-- brush across the palette -->
  <g transform="translate(1390 540) rotate(66)">
    <rect x="-8" y="-420" width="16" height="360" rx="8" fill="#6B4A32"/>
    <rect x="-8" y="-420" width="6" height="360" rx="3" fill="#fff" opacity="0.18"/>
    <rect x="-11" y="-70" width="22" height="48" fill="#B9C0CA"/>
    <rect x="-11" y="-52" width="22" height="4" fill="#8E97A4"/>
    <path d="M-11 -22 C -14 20, -4 50, 0 70 C 4 50, 14 20, 11 -22 Z" fill="#E5486E"/>
  </g>

  <!-- splatters -->
  <circle cx="610" cy="100" r="12" fill="#7A4FD6"/>
  <circle cx="650" cy="140" r="6" fill="#7A4FD6"/>
  <circle cx="1230" cy="540" r="12" fill="#E5486E"/>
  <circle cx="1190" cy="570" r="6" fill="#F2B632"/>
  <circle cx="1300" cy="60" r="10" fill="#2F6FDB"/>
  <circle cx="1335" cy="100" r="5" fill="#1FA37A"/>

  <!-- words -->
  <path d="M520 284 C 700 266, 860 298, 1020 276 S 1250 270, 1400 282" fill="none" stroke="#E5486E" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
  <text x="960" y="246" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#2A2140">Sketch. Paint. Repeat.</text>
  <text x="960" y="340" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="28" fill="#5A5270">Sketch pads, graphite pencils and watercolors</text>
  <text x="960" y="378" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="28" fill="#5A5270">for the days you just want to make something.</text>
</svg>
